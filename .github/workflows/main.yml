
name: Build My VoIP APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find ZIP file
        run: |
          echo "Searching for MyVoIP ZIP..."
          find . -type f -iname 'MyVoIP_GitHub_Starter*.zip'

          ZIP_FILE=$(find . -type f -iname 'MyVoIP_GitHub_Starter*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MyVoIP ZIP file not found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVoIP-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
